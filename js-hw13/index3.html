<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    blockquote {
      background: #f9f9f9;
      border-left: 5px solid #ccc;
      margin: 1.5em 10px;
      padding: 0.5em 10px;
    }

    p {
      display: inline;
    }

    footer {
      margin-top: 10px;
      font-style: italic;
    }

    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Випадкова цитата (Fetch API)</h2>
  <button onclick="fetchRandomQuote()">Отримати іншу цитату</button>
  
  <div id="quote-container"></div>

  <script>
    function fetchRandomQuote() {
      const apiKey = 'e1687239'; 
      const container = document.getElementById('quote-container');
      container.innerHTML = '<p>Завантаження цитати...</p>';

      fetch('https://api.api-ninjas.com/v1/quotes', {
        method: 'GET',
        headers: {
          'X-Api-Key': apiKey,
          'Content-Type': 'application/json'
        }
      })
        .then(response => {
          if (!response.ok) {
            throw new Error(`Помилка сервера: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          if (data && data.length > 0) {
            const quote = data[0];
            container.innerHTML = `
              <blockquote>
                <p>"${quote.quote}"</p>
                <footer>— <strong>${quote.author}</strong></footer>
              </blockquote>
            `;
          }
        })
        .catch(error => {
          console.error('Помилка при отриманні цитати:', error);
          container.innerHTML = '<p style="color:red;">Не вдалося завантажити цитату.</p>';
        });
    }

    fetchRandomQuote();
  </script>

</body>
</html>
