<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Create new color</h2>
    
    <form id="colorForm" novalidate>
        <div class="form-group">
            <div class="label-row">
                <label for="colorName">Color:</label>
                <span id="nameError" class="error-message"></span>
            </div>
            <input type="text" id="colorName">
        </div>

        <div class="form-group">
            <div class="label-row">
                <label for="colorType">Type:</label>
            </div>
            <select id="colorType">
                <option value="RGB">RGB</option>
                <option value="RGBA">RGBA</option>
                <option value="HEX">HEX</option>
            </select>
        </div>

        <div class="form-group">
            <div class="label-row">
                <label for="colorCode">Code:</label>
                <span id="codeError" class="error-message"></span>
            </div>
            <input type="text" id="colorCode">
        </div>

        <button type="submit">Save</button>
    </form>

    <h2>All colors</h2>
    <div id="palette" class="palette"></div>
</div>

<script src="script.js"></script>
</body>
</html>
